<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Notes Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app" v-cloak>
        <h1>Notes App</h1>

        <!-- Auth Section (if not logged in) -->
        <div v-if="!token">
            <h2 v-if="isLoginMode">Login</h2>
            <h2 v-else>Register</h2>

            <p class="message" v-if="authMessage">{{ authMessage }}</p>

            <form @submit.prevent="isLoginMode ? login() : register()">
                <label>Email</label>
                <input type="email" v-model="authEmail" required>

                <label>Password</label>
                <input type="password" v-model="authPassword" required>

                <button type="submit">{{ isLoginMode ? 'Login' : 'Register' }}</button>
            </form>

            <button class="toggle-btn" @click="isLoginMode = !isLoginMode">
                {{ isLoginMode ? 'Need an account? Register' : 'Already have an account? Login' }}
            </button>
        </div>

        <!-- Authenticated Section (if logged in) -->
        <div v-else>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <p>You are securely logged in!</p>
                <button @click="logout"
                    style="background-color: #ef4444; width: auto; padding: 5px 15px;">Logout</button>
            </div>

            <h2>Your Notes</h2>

            <!-- Create Note Form -->
            <div class="note-card" style="background-color: #fff; margin-bottom: 30px; border: 2px dashed #ccc;">
                <h3 style="margin-bottom: 15px;">Create a New Note</h3>
                <form @submit.prevent="createNote">
                    <label>Title</label>
                    <input type="text" v-model="newNoteTitle" required placeholder="Note Title">

                    <label>Content</label>
                    <textarea v-model="newNoteContent" required placeholder="Write your note here..."
                        style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; resize: vertical; min-height: 80px; font-family: Arial, sans-serif;"></textarea>

                    <button type="submit">Create Note</button>
                </form>
            </div>

            <p v-if="isLoading" style="color: #666;">Loading notes...</p>
            <p v-if="notesError" class="message">{{ notesError }}</p>

            <div v-if="!isLoading && notes.length === 0" style="margin: 20px 0; color: #666;">
                <p>You don't have any notes yet.</p>
            </div>

            <div v-if="!isLoading && notes.length > 0">
                <div v-for="note in notes" :key="note.id" class="note-card">
                    <!-- Viewing Mode -->
                    <div v-if="editingNoteId !== note.id">
                        <h3>{{ note.title }}</h3>
                        <p>{{ note.content }}</p>
                        <span class="note-date">Created: {{ note.created_at }}</span>
                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <button @click="startEditing(note)"
                                style="width: auto; padding: 5px 15px; font-size: 0.9rem; background-color: #10b981;">Edit</button>
                            <button @click="deleteNote(note.id)"
                                style="width: auto; padding: 5px 15px; font-size: 0.9rem; background-color: #ef4444;">Delete</button>
                        </div>
                    </div>

                    <!-- Editing Mode -->
                    <div v-else>
                        <input type="text" v-model="editNoteTitle" style="margin-bottom: 5px;">
                        <textarea v-model="editNoteContent"
                            style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; min-height: 80px; font-family: Arial, sans-serif;"></textarea>
                        <div style="display: flex; gap: 10px;">
                            <button @click="updateNote(note.id)"
                                style="width: auto; padding: 5px 15px; background-color: #10b981;">Save</button>
                            <button @click="cancelEditing"
                                style="width: auto; padding: 5px 15px; background-color: #9ca3af;">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Vue App Logic -->
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    token: localStorage.getItem('access_token') || '',
                    isLoginMode: true,
                    authEmail: '',
                    authPassword: '',
                    authMessage: '',
                    notes: [],
                    isLoading: false,
                    notesError: '',
                    newNoteTitle: '',
                    newNoteContent: '',
                    editingNoteId: null,
                    editNoteTitle: '',
                    editNoteContent: ''
                }
            },
            created() {
                if (this.token) {
                    axios.defaults.headers.common['Authorization'] = `Bearer ${this.token}`;
                    this.fetchNotes();
                }
            },
            methods: {
                startEditing(note) {
                    this.editingNoteId = note.id;
                    this.editNoteTitle = note.title;
                    this.editNoteContent = note.content;
                },
                cancelEditing() {
                    this.editingNoteId = null;
                    this.editNoteTitle = '';
                    this.editNoteContent = '';
                },
                async updateNote(id) {
                    try {
                        await axios.put(`http://127.0.0.1:5000/api/notes/${id}`, {
                            title: this.editNoteTitle,
                            content: this.editNoteContent
                        });
                        this.cancelEditing();
                        this.fetchNotes();
                    } catch (error) {
                        alert(error.response?.data?.message || 'Failed to update note');
                    }
                },
                async deleteNote(id) {
                    if (confirm('Are you sure you want to delete this note?')) {
                        try {
                            await axios.delete(`http://127.0.0.1:5000/api/notes/${id}`);
                            this.fetchNotes();
                        } catch (error) {
                            alert(error.response?.data?.message || 'Failed to delete note');
                        }
                    }
                },
                async createNote() {
                    try {
                        await axios.post('http://127.0.0.1:5000/api/notes', {
                            title: this.newNoteTitle,
                            content: this.newNoteContent
                        });
                        this.newNoteTitle = '';
                        this.newNoteContent = '';
                        this.fetchNotes(); // Refresh the notes list
                    } catch (error) {
                        alert(error.response?.data?.message || 'Failed to create note');
                    }
                },
                async fetchNotes() {
                    this.isLoading = true;
                    this.notesError = '';
                    try {
                        const response = await axios.get('http://127.0.0.1:5000/api/notes');
                        this.notes = response.data;
                    } catch (error) {
                        this.notesError = 'Failed to load notes.';
                    } finally {
                        this.isLoading = false;
                    }
                },
                async register() {
                    try {
                        const response = await axios.post('http://127.0.0.1:5000/api/register', {
                            email: this.authEmail,
                            password: this.authPassword
                        });
                        this.authMessage = response.data.message;
                        this.isLoginMode = true; // Switch to login after successful register
                        this.authPassword = ''; // Clear password field
                    } catch (error) {
                        this.authMessage = error.response?.data?.message || 'Registration failed';
                    }
                },
                async login() {
                    try {
                        const response = await axios.post('http://127.0.0.1:5000/api/login', {
                            email: this.authEmail,
                            password: this.authPassword
                        });
                        this.token = response.data.access_token;
                        localStorage.setItem('access_token', this.token);
                        axios.defaults.headers.common['Authorization'] = `Bearer ${this.token}`;
                        this.authMessage = '';
                        this.authEmail = '';
                        this.authPassword = '';
                        this.fetchNotes();
                    } catch (error) {
                        this.authMessage = error.response?.data?.message || 'Login failed';
                    }
                },
                logout() {
                    this.token = '';
                    localStorage.removeItem('access_token');
                    delete axios.defaults.headers.common['Authorization'];
                    this.authMessage = 'You have logged out successfully.';
                    this.notes = [];
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
